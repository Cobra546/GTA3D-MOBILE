<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>GTA3D-MOBILE — Prototype</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="game"></div>

  <div id="loading">
    <div class="loader-card">
      <div class="logo">GTA3D<span>-MOBILE</span></div>
      <div class="loader-bar"><i></i></div>
      <small>Loading city prototype…</small>
    </div>
  </div>

  <div id="hud">
    <div class="topbar">
      <div class="brand">GTA3D<span>-MOBILE</span></div>
      <div class="stats">
        <div>❤️ <b id="health">100</b></div>
        <div>💵 <b id="money">2500</b></div>
      </div>
    </div>

    <div id="message">Explore the city</div>
    <div id="interact">ENTER BUILDING</div>

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <div class="actions">
      <button id="jump" aria-label="Jump">↑</button>
      <button id="interactBtn" aria-label="Interact">↪</button>
    </div>

    <div class="hint">Move • Explore • Enter the marked building</div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
